name: CI Pipeline & Quality Gates

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  NEXT_PUBLIC_SITE_URL: https://ashkri.com
  STRICT_CANONICAL_URL: true

jobs:
  quality-gates:
    name: Typecheck, Unit Tests, Build & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: Unit & Component Test Suite
        run: npm test

      - name: Production Next.js 16 Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Multi-Viewport E2E & Accessibility Suite
        run: npx playwright test

      - name: Upload Test Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

